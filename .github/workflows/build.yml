name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/server/go.mod

      - name: Vet
        run: go vet -C src/server ./...

      - name: Cross-compile all targets
        run: ./build.sh
